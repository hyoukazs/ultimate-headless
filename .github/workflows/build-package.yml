name: Build Linux package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored OTCv8 against upstream
        run: bash tools/verify-third-party.sh
      - name: Inspect login context
        run: python3 -I tools/inspect-login-context.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libluajit-5.1-dev libphysfs-dev libzip-dev libssl-dev libboost-system-dev libboost-filesystem-dev zlib1g-dev libbz2-dev
      - name: Build and package
        env:
          UH_BUILD_JOBS: '2'
        run: bash tools/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-headless-linux-x86_64
          path: |
            out/*.tar.gz
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
